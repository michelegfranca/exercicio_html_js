<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Depósito</title>
    <link rel="stylesheet" href="./main.css" />
</head>
<body>.
    <div class="container">
        <h1>Depósito EBAC</h1>
        <h2>Quanto você gostaria de depositar?</h2>
        <h3>Coloque o valor em reais e embaixo coloque os centavos</h3>
        <div class="formulario">
            <form id='form-deposito'>
                <input type="number" id="reais" required placeholder="Valor em reais" />
                <input type="number" id="cents" required placeholder="Valor em centavos" />
                <textarea placeholder="Quer deixar algum comentário? (opcional)" id="description" ></textarea>
                <button id="btn-save" class="button" type="submit">Enviar</button>
            </form>
        </div>
    </div>
    <script src="./main.js"></script>
</body>
</html>
